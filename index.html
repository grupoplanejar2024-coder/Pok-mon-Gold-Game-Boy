<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pokémon Gold — Retro Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #12100a;
      color: #f5d76e;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    header {
      width: 100%;
      padding: 10px 16px;
      background: linear-gradient(90deg, #2b2106, #4a3708, #2b2106);
      border-bottom: 2px solid #d4af37;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .badge {
      background-color: #d4af37;
      color: #12100a;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .emulator-wrapper {
      flex: 1;
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    #game {
      width: 100%;
      height: 100%;
      max-height: 82vh;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
      border: 1px solid rgba(212, 175, 55, 0.4);
    }
  </style>
</head>
<body>
  <header>
    <span><strong>Pokémon Gold</strong> — Game Boy Color</span>
    <span class="badge">EmulatorJS</span>
  </header>

  <main class="emulator-wrapper">
    <div id="game"></div>
  </main>

  <script>
    EJS_player = "#game";
    EJS_core = "gbc"; // Game Boy / Game Boy Color
    EJS_gameName = "Pokemon Gold";
    EJS_color = "#d4af37";
    EJS_startOnLoaded = true;
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    EJS_gameUrl = "./Pokemon - Gold Version.gbc"; // Ajusta para o nome exato do teu ficheiro ROM
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
